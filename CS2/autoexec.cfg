// tokauaCS2
// https://github.com/tokaualol/configs/tree/main/CS2

// miscellaneous
fps_max "360"
r_fullscreen_gamma "2.5"
sensitivity "2.2"
volume "0.64"
engine_no_focus_sleep "0"
r_show_build_info "0"
snd_steamaudio_enable_perspective_correction "1"
developer "1"

// binds & aliases
bind "mwheelup" "+jump"
bind "mwheeldown" "+jump"
bind "v" "+voicerecord"
bind "\" "voice_modenable_toggle" // mute vc
bind "h" "noclip"
bind "]" "toggle cl_draw_only_deathnotices" // toggle hud
alias "dc" "disconnect"
alias "q" "quit"

// viewmodel
viewmodel_fov "68"
viewmodel_offset_x "2.5"
viewmodel_offset_y "2"
viewmodel_offset_z "-2"

// hud
hud_scaling "0.9"
cl_hud_color "7"
cl_teamcounter_playercount_instead_of_avatars "1"
ui_steam_overlay_notification_position "topright"
apply_crosshair_code "CSGO-knFZ4-hUJxU-xpQYR-wzSNO-ZwedJ"
cl_crosshair_friendly_warning "0"
cl_weapon_selection_rarity_color "1"

// prediction
cl_predict_body_shot_fx "0"
cl_predict_head_shot_fx "0"
cl_predict_kill_ragdolls "0"
cl_predict_weapon_drop "0"
cl_predict_bomb_defusal "0"

// say
exec bikinibabelover_cs2/bikinibabelover_01

// steamhappy
log_flags Console +donotecho
echoln " "
log_color General "5BCEFAFF"
